name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify tag and manifest versions
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const packageJson = require("./package.json");
          const plugin = require("./plugin.json");
          const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
          if (packageJson.version !== tag || plugin.version !== tag) {
            throw new Error(`Tag ${tag}, package ${packageJson.version}, and plugin ${plugin.version} must match.`);
          }
          if (!fs.readFileSync("CHANGELOG.md", "utf8").includes(`## ${tag}`)) {
            throw new Error(`CHANGELOG.md has no ${tag} section.`);
          }
          NODE
      - run: npm run validate
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to npm
        if: vars.NPM_PUBLISH_ENABLED == 'true'
        run: npm publish --access public --provenance
      - name: Record skipped npm publication
        if: vars.NPM_PUBLISH_ENABLED != 'true'
        run: |
          {
            echo "## npm publication"
            echo
            echo "Skipped because the repository variable \`NPM_PUBLISH_ENABLED\` is not \`true\`."
          } >> "$GITHUB_STEP_SUMMARY"
