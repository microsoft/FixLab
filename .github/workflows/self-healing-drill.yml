name: Self-Healing Proof Drill

on:
  workflow_dispatch:
  schedule:
    - cron: "19 4 1 * *"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prove failure detection and automated recovery paths
        run: >-
          npm run self-healing:verify --
          --report artifacts/self-healing-proof.json
      - name: Upload proof-of-bug and proof-of-fix evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-healing-proof
          path: artifacts/self-healing-proof.json
          if-no-files-found: error
          retention-days: 30
